<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reproductor | badbear.music</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#07111f;color:#fff}
    body{display:grid;place-items:center;padding:14px;background:
      radial-gradient(circle at 15% 10%,rgba(0,91,232,.28),transparent 38%),
      radial-gradient(circle at 90% 90%,rgba(255,106,0,.18),transparent 35%),
      linear-gradient(145deg,#07111f,#0c1830 60%,#111b2d)}
    .player{width:100%;max-width:390px;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px;background:rgba(10,21,38,.92);box-shadow:0 18px 50px rgba(0,0,0,.38)}
    .brand{font-weight:900;font-size:18px;letter-spacing:-.6px;color:#58a0ff}.brand span{color:#ff7a1a}
    .kicker{margin-top:14px;color:#ff8b3d;font-size:10px;font-weight:900;letter-spacing:1.4px}
    h1{margin:4px 0 4px;font-size:24px;line-height:1.15}
    .genre{margin:0 0 14px;color:#aebed1;font-size:13px}
    audio{width:100%;height:44px}
    .note{margin:12px 0 0;color:#8292a5;font-size:11px;line-height:1.4}
    .denied{display:none;text-align:center;padding:16px}
    .denied strong{display:block;margin-bottom:8px;color:#ff8b3d}
  </style>
</head>
<body>
  <main class="player" id="player">
    <div class="brand">badbear.<span>music</span></div>
    <div class="kicker">REPRODUCTOR FLOTANTE</div>
    <h1 id="track-title">Cargando…</h1>
    <p class="genre" id="track-genre"></p>
    <audio id="audio" controls autoplay preload="auto"></audio>
    <p class="note">Mantén esta ventana abierta. Puedes seguir navegando por WAJOMEA.GROUP sin interrumpir la reproducción.</p>
  </main>

  <section class="player denied" id="denied">
    <strong>Acceso requerido</strong>
    Abre badbear.music, ingresa la clave y usa el botón “Reproducir flotante”.
  </section>

<script>
(() => {
  const authorized = sessionStorage.getItem("badbear_music_access") === "authorized";
  if (!authorized) {
    document.getElementById("player").style.display = "none";
    document.getElementById("denied").style.display = "block";
    return;
  }

  const tracks = {
    "me-quedo-tu-voz": {
      title: "Me quedó tu voz",
      genre: "Bachata",
      src: "audios/bachata/me-quedo-tu-voz.mp3"
    },
    "alas-de-mariposa": {
      title: "Alas de mariposa",
      genre: "Badbear Latin",
      src: "audios/badbear-latin/alas-de-mariposa.mp3"
    },
    "no-voy-a-volver": {
      title: "No voy a volver",
      genre: "Badbear Latin",
      src: "audios/badbear-latin/no-voy-a-volver.mp3"
    }
  };

  const params = new URLSearchParams(location.search);
  const id = params.get("track") || "me-quedo-tu-voz";
  const track = tracks[id] || tracks["me-quedo-tu-voz"];

  document.getElementById("track-title").textContent = track.title;
  document.getElementById("track-genre").textContent = track.genre;
  document.title = track.title + " | badbear.music";

  const audio = document.getElementById("audio");
  audio.src = track.src;

  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: "badbear.music",
      album: track.genre
    });
  }

  audio.play().catch(() => {});
})();
</script>
</body>
</html>
