<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reproductor | badbear.music</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#07111f;color:#fff}
    body{display:grid;place-items:center;padding:14px;background:
      radial-gradient(circle at 15% 10%,rgba(0,91,232,.28),transparent 38%),
      radial-gradient(circle at 90% 90%,rgba(255,106,0,.18),transparent 35%),
      linear-gradient(145deg,#07111f,#0c1830 60%,#111b2d)}
    .player{width:100%;max-width:430px;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px;background:rgba(10,21,38,.94);box-shadow:0 18px 50px rgba(0,0,0,.38)}
    .brand{font-weight:900;font-size:18px;letter-spacing:-.6px;color:#58a0ff}.brand span{color:#ff7a1a}
    .kicker{margin-top:14px;color:#ff8b3d;font-size:10px;font-weight:900;letter-spacing:1.4px}
    h1{margin:4px 0 4px;font-size:24px;line-height:1.15}
    .genre{margin:0;color:#aebed1;font-size:13px}
    .queue{display:flex;justify-content:space-between;gap:10px;margin:12px 0 10px;color:#8192a8;font-size:11px;font-weight:700}
    audio{width:100%;height:44px}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .controls button{border:1px solid rgba(255,255,255,.14);border-radius:11px;background:#111f33;color:#fff;padding:10px 12px;font-size:12px;font-weight:900;cursor:pointer}
    .controls button:hover{background:#172a45}
    .playlist{margin-top:12px;padding:10px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.03);max-height:210px;overflow:auto}
    .playlist-title{font-size:10px;font-weight:900;letter-spacing:1.2px;color:#8093aa;margin-bottom:7px}
    .playlist ol{list-style:none;padding:0;margin:0;display:grid;gap:5px}
    .playlist button{width:100%;text-align:left;border:0;border-radius:8px;background:transparent;color:#aebed1;padding:7px 9px;font-size:12px;cursor:pointer}
    .playlist button:hover{background:rgba(255,255,255,.06);color:#fff}
    .playlist button.active{background:rgba(0,91,232,.22);color:#fff;font-weight:900}
    .note{margin:12px 0 0;color:#8292a5;font-size:11px;line-height:1.4}
    .denied{display:none;text-align:center;padding:16px}
    .denied strong{display:block;margin-bottom:8px;color:#ff8b3d}
  </style>
  <script src="catalog.js?v=20261006-catalog1"></script>
</head>
<body>
  <main class="player" id="player">
    <div class="brand">badbear.<span>music</span></div>
    <div class="kicker">REPRODUCTOR FLOTANTE · REPRODUCCIÓN CONTINUA</div>
    <h1 id="track-title">Cargando…</h1>
    <p class="genre" id="track-genre"></p>

    <div class="queue">
      <span id="library-name"></span>
      <span id="queue-position"></span>
    </div>

    <audio id="audio" controls autoplay preload="auto"></audio>

    <div class="controls">
      <button type="button" id="prev-track">← Anterior</button>
      <button type="button" id="next-track">Siguiente →</button>
    </div>

    <div class="playlist">
      <div class="playlist-title">BIBLIOTECA ACTUAL</div>
      <ol id="playlist"></ol>
    </div>

    <p class="note">La reproducción continúa hasta la última canción y vuelve automáticamente a la primera de esta biblioteca.</p>
  </main>

  <section class="player denied" id="denied">
    <strong>Acceso requerido</strong>
    Abre badbear.music, ingresa la clave y usa “Reproducir flotante”.
  </section>

<script>
(() => {
  const authorized = sessionStorage.getItem("badbear_music_access") === "authorized";
  if (!authorized) {
    document.getElementById("player").style.display = "none";
    document.getElementById("denied").style.display = "block";
    return;
  }

  const catalog = Array.isArray(window.BADBEAR_MUSIC_CATALOG)
    ? window.BADBEAR_MUSIC_CATALOG
    : [];

  const params = new URLSearchParams(location.search);
  const requestedTrackId = params.get("track");
  const requestedLibraryId = params.get("library");

  let library = catalog.find(item => item.id === requestedLibraryId);

  if (!library && requestedTrackId) {
    library = catalog.find(item =>
      Array.isArray(item.tracks) &&
      item.tracks.some(track => track.id === requestedTrackId)
    );
  }

  if (!library) library = catalog[0];

  if (!library || !Array.isArray(library.tracks) || !library.tracks.length) {
    document.getElementById("track-title").textContent = "Biblioteca vacía";
    document.getElementById("track-genre").textContent = "No hay canciones disponibles.";
    return;
  }

  let currentIndex = Math.max(
    0,
    library.tracks.findIndex(track => track.id === requestedTrackId)
  );

  const audio = document.getElementById("audio");
  const titleEl = document.getElementById("track-title");
  const genreEl = document.getElementById("track-genre");
  const libraryEl = document.getElementById("library-name");
  const positionEl = document.getElementById("queue-position");
  const playlistEl = document.getElementById("playlist");

  function renderPlaylist() {
    playlistEl.innerHTML = "";

    library.tracks.forEach((track, index) => {
      const li = document.createElement("li");
      const button = document.createElement("button");

      button.type = "button";
      button.textContent = (index + 1) + ". " + track.title;
      button.className = index === currentIndex ? "active" : "";

      button.addEventListener("click", () => {
        loadTrack(index, true);
      });

      li.appendChild(button);
      playlistEl.appendChild(li);
    });
  }

  function updateMediaSession(track) {
    if (!("mediaSession" in navigator)) return;

    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: "badbear.music",
      album: library.name
    });
  }

  function loadTrack(index, autoplay = true) {
    const total = library.tracks.length;
    currentIndex = ((index % total) + total) % total;

    const track = library.tracks[currentIndex];

    titleEl.textContent = track.title;
    genreEl.textContent = library.name;
    libraryEl.textContent = "Biblioteca: " + library.name;
    positionEl.textContent = (currentIndex + 1) + " de " + total;
    document.title = track.title + " | badbear.music";

    audio.src = track.src;
    audio.load();

    renderPlaylist();
    updateMediaSession(track);

    history.replaceState(
      null,
      "",
      "player.html?library=" + encodeURIComponent(library.id) +
      "&track=" + encodeURIComponent(track.id)
    );

    if (autoplay) audio.play().catch(() => {});
  }

  function nextTrack() {
    loadTrack(currentIndex + 1, true);
  }

  function previousTrack() {
    loadTrack(currentIndex - 1, true);
  }

  document.getElementById("next-track").addEventListener("click", nextTrack);
  document.getElementById("prev-track").addEventListener("click", previousTrack);

  audio.addEventListener("ended", nextTrack);

  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("nexttrack", nextTrack);
      navigator.mediaSession.setActionHandler("previoustrack", previousTrack);
    } catch (_) {}
  }

  loadTrack(currentIndex, true);
})();
</script>
</body>
</html>
