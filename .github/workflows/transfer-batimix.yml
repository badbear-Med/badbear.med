name: Transfer BATIMIX media
on:
  push:
    branches: [campus/validacion-sesion-proyectos]
    paths: [.github/workflows/transfer-batimix.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deactivate the temporary upload endpoint
        env:
          CLOUDFLARE_ACCOUNT_ID: caace9c94fd11467e298cdee61f2397b
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config tools/batimix-transfer/wrangler.json

